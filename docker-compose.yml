services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: cadete-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:-cadete}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadete} -d ${POSTGRES_DB:-cadete}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cadete-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cadete-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadete}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cadete}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env}
      # La demo corre acelerada (el simulador se mueve a ~90 km/h): el tiempo estimado usa la misma velocidad.
      VELOCIDAD_ESTIMADA_KMH: ${VELOCIDAD_ESTIMADA_KMH:-90}
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
      - ./web:/app/web

  worker:
    build: .
    container_name: cadete-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadete}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cadete}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app

  simulator:
    build: .
    container_name: cadete-simulator
    restart: unless-stopped
    command: ["python", "-m", "app.simulator.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadete}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cadete}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
  redis_data:
